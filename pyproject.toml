[project]
name = "hotdata-dlt-destination"
version = "0.8.0"
description = "dlt destination for loading data into Hotdata managed databases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "669988+eddietejeda@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    # The dataset read interface subclasses dlt internals (SqlClientBase,
    # DBApiCursorImpl, WithSqlClient) that shift between minor releases, so cap
    # the minor. The SDKs move fast too (QueryResult / query-path surface), so
    # cap those to the current minor as well. See docs/sql-client-spec.md §11.
    "dlt>=1.28.1,<1.29",
    # TODO(release): set the exact floors once the key-capable client + the SDK
    # carrying mode/key are cut. Native delete/update/upsert require the `key`
    # field on the managed-table decls (client) and create_managed_database(keys=)
    # / add_managed_table(key=) / load_managed_table(mode=) (framework).
    "hotdata>=0.7.0,<0.8",
    "hotdata-framework>=0.7.0,<0.8",
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
# Live ibis backend for dataset().ibis(). Pulls the out-of-tree ibis.hotdata
# backend and ibis itself; the base install stays ibis-free. hotdata-ibis 0.3.0+
# addresses managed databases by id, which the bridge relies on.
ibis = ["hotdata-ibis>=0.3,<0.4", "ibis-framework>=12,<13"]

[project.urls]
Homepage = "https://hotdata.dev"
Repository = "https://github.com/hotdata-dev/hotdata-dlt-destination"
Changelog = "https://github.com/hotdata-dev/hotdata-dlt-destination/blob/main/CHANGELOG.md"
Issues = "https://github.com/hotdata-dev/hotdata-dlt-destination/issues"

[project.scripts]
hotdata-dlt-destination = "hotdata_dlt_destination.cli:main"
hotdata-dlt-demo = "hotdata_dlt_destination.pipelines.demo:main"
hotdata-dlt-ibis-demo = "hotdata_dlt_destination.pipelines.ibis_demo:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mypy>=1.11",
    "ruff>=0.15.13",
    "datafusion>=54.0.0",
    "ibis-framework>=12.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires live Hotdata and Linear credentials",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src",
  "tests",
]
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
allow_untyped_globals = false
implicit_reexport = false
implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
strict_bytes = true
extra_checks = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "C4", "DTZ", "T20", "RET", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "E501"]
"src/hotdata_dlt_destination/cli.py" = ["T201"]
"src/hotdata_dlt_destination/pipelines/**/*.py" = ["T201"]
# dlt destination factories use a lowercase class name (e.g. `duckdb`, `filesystem`)
# and implicit-Optional kwargs (None = "fall back to config default") by convention.
"src/hotdata_dlt_destination/factory.py" = ["N801", "RUF013"]
# JobClientBase/WithStateSync overrides mirror dlt base-class signatures (implicit Optional).
"src/hotdata_dlt_destination/job_client.py" = ["RUF013"]
"tests/**/*.py" = ["N814"]
